<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта фронта — UAV</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1014;color:#d9e6f2;
         font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    main{max-width:640px;padding:32px;text-align:center}
    h1{margin:0 0 8px;font-size:28px;letter-spacing:.02em}

    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#8aa15c;margin-right:8px;

<body>
<main>
  <h1><span class="dot"></span>Карта фронта — UAV</h1>
  <p>Репозиторий готов. Сюда бот будет публиковать страницу карты.</p>
  <p>Публикация: push в <code>main</code> → GitHub Actions → Pages.</p>
  <p>Если сайт лежит в папке <code>dist/</code>, workflow возьмёт её, иначе — корень репозитория.</p>
</main>

</html>
