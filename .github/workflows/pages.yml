name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          if [ -d dist ]; then cp -a dist _site; else mkdir -p _site && cp -a . _site/; fi
          rm -rf _site/.git _site/.github
          # SPA-фолбэк: если нет 404.html, отдаём index.html
          if [ ! -f _site/404.html ] && [ -f _site/index.html ]; then cp _site/index.html _site/404.html; fi
          ls -la _site | head -20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
